<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Sprintive — AI-powered Agile project management. Automatically records meetings, generates transcripts, extracts tasks, and updates your Kanban board." />
  <meta name="keywords" content="AI scrum, agile, project management, meeting transcription, kanban, sprint planning" />
  <meta property="og:title" content="Sprintive — AI That Runs Your Scrum Meetings" />
  <meta property="og:description"
    content="Automatically record meetings, extract tasks, create tickets, and update your Kanban board with AI." />
  <title>Sprintive — AI-Powered Agile Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('sprintive-theme');
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if (theme === 'light' || (!theme && prefersLight)) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
